<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compo Expert | Portal de Acesso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" href="./assets/compo-expert-logo.svg?v=2" type="image/svg+xml" />
  <link rel="shortcut icon" href="./assets/compo-expert-logo.svg?v=2" type="image/svg+xml" />
  <link rel="stylesheet" href="./login.css?v=20260831" />
</head>
<body>
  <div class="login-page">
    <video autoplay muted loop playsinline class="login-video-bg">
      <source src="./assets/login-bg.mp4" type="video/mp4">
    </video>
    <div class="login-bg-overlay"></div>
    <div class="login-card-wrapper">
      <div class="login-card">
        <div class="login-header">
          <img src="./assets/compo-expert-logo.svg" alt="Compo Expert Logo" class="login-logo">
          <h1>Portal de Acesso</h1>
          <p>Insira suas credenciais para acessar o painel corporativo.</p>
        </div>
        
        <form id="loginForm" class="login-form">
          <div class="form-group">
            <label for="email">Usuário</label>
            <input type="text" id="email" placeholder="nome@compo-expert.com" required autocomplete="username">
          </div>
          
          <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
          </div>

          <div class="form-actions">
            <label class="remember-me">
              <input type="checkbox" id="remember" checked> Manter conectado
            </label>
            <a href="#" class="forgot-password" onclick="alert('Funcionalidade demonstrativa. Use admin/admin para entrar.')">Esqueci minha senha</a>
          </div>
          
          <div id="loginError" class="login-error" hidden>Credenciais inválidas. Tente admin / admin.</div>
          
          <button type="submit" class="login-btn">Entrar</button>
        </form>
      </div>
      <div class="login-footer">
        &copy; 2026 COMPO EXPERT. Todos os direitos reservados.
      </div>
    </div>
  </div>

  <script src="./login.js"></script>
</body>
</html>
